<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <script type="module">
            import { animate, scroll } from "https://cdn.jsdelivr.net/npm/motion@latest/+esm"
            const urlParams = new URLSearchParams(window.location.search);
            const currentWeek = Number(urlParams.get("week") ?? 1);

            const sectionsListItems = document.getElementById("sections").children;

            for (let i = 0; i < sectionsListItems.length; i++) {
                if (i + 1 > currentWeek) {
                    sectionsListItems[i].style.display = "none";
                }
            }
            
        </script>
    </head>

            <h1 class="animate">all the pretty horses by cormac mccarthy</h1>
        </header>
